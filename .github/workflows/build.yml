name: Build Minecraft Add-on

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Criar arquivo .mcaddon
        run: |
          zip -r meu_addon_supremo.mcaddon BP resource_pack

      - name: Upload do Add-on como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Meu-Addon-Supremo
          path: meu_addon_supremo.mcaddon
