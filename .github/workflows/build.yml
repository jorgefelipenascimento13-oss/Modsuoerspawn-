name: Build MCPACK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .mcpack file
        run: |
          # Compacta tudo o que está na raiz, excluindo apenas a pasta interna de controle do git/github
          zip -r ModBehaviorPack.mcpack . -x ".git/*" ".github/*"

      - name: Upload .mcpack as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ModBehaviorPack
          path: ModBehaviorPack.mcpack
          compression-level: 0
