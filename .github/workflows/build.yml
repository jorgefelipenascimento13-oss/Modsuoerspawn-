name: Build MCPACK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .mcpack file
        run: |
          # Entra na raiz do workspace e compacta diretamente o conteúdo exigido pelo Minecraft
          zip -r ModBehaviorPack.mcpack manifest.json spawn_rules enchantments

      - name: Upload .mcpack as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ModBehaviorPack
          path: ModBehaviorPack.mcpack
          compression-level: 0
